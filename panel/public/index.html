<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Autentificare</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<form id="f" class="card" autocomplete="on">
  <div class="logo">VELO<b>SYNTECH</b></div>
  <h1>Auto-Poster</h1>
  <p id="msg">Introdu parola ca să intri în panou.</p>
  <input type="password" id="pw" placeholder="Parola" autocomplete="current-password" required autofocus>
  <button id="go">Intră</button>
</form>
<script src="/login.js"></script>
</body>
</html>
